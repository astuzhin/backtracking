[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtracking"
version = "0.1.0"
description = "Minimal numba-compatible proton backtracking with IGRF-14."
requires-python = ">=3.10"
dependencies = ["numpy","numba","pandas","matplotlib"]

[tool.setuptools]
packages = ["backtracking"]
include-package-data = true

[tool.setuptools.package-dir]
backtracking = "."

[tool.setuptools.package-data]
backtracking = [
    "igrf14coeffs.txt",
    "ts05_c_wrapper.f90",
    "ts05_fixed.f",
    "ts05/*.dat",
]
